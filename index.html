<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Explorer</title>
  <meta name="description" content="Explore any country in the world: population, currencies, languages, flags, neighbors and more." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235b8cff' stroke-width='2'><circle cx='12' cy='12' r='9'/><path d='M3 12h18M12 3c2.5 2.5 2.5 15.5 0 18M12 3c-2.5 2.5-2.5 15.5 0 18'/></svg>" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9.25" />
          <path d="M2.75 12h18.5" />
          <path d="M12 2.75c2.6 2.6 2.6 15.9 0 18.5" />
          <path d="M12 2.75c-2.6 2.6-2.6 15.9 0 18.5" />
          <path d="M4.6 6.5c4.5 2.2 10.3 2.2 14.8 0" />
          <path d="M4.6 17.5c4.5-2.2 10.3-2.2 14.8 0" />
        </svg>
        <h1>World<span>Explorer</span></h1>
      </div>
      <p class="tagline">Facts, flags and figures for every country on Earth.</p>
      <div class="controls">
        <input id="search" type="search" placeholder="Search countries…" autocomplete="off" />
        <select id="region">
          <option value="">All regions</option>
          <option>Africa</option>
          <option>Americas</option>
          <option>Asia</option>
          <option>Europe</option>
          <option>Oceania</option>
          <option>Antarctic</option>
        </select>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p id="status" class="status">Loading countries…</p>
    <div id="grid" class="grid"></div>
    <nav id="pager" class="pager" aria-label="Pagination"></nav>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button id="modal-close" class="close" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer>
    <div class="wrap">
      <span>Data: <a href="https://countries.dev" target="_blank" rel="noopener">countries.dev</a> · Deployed on Cloudways Velocity</span>
    </div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
